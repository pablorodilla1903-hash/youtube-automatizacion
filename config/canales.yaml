# ─────────────────────────────────────────────────────────────────────────────
# Configuración de los canales. Puedes editar este archivo desde la web de
# GitHub (icono del lápiz) sin tocar nada más.
# ─────────────────────────────────────────────────────────────────────────────

zona_horaria: Europe/Madrid   # tu hora local (para las horas de publicación)
drive_dias_guardar: 7         # se borran de Drive las carpetas con más días (15 GB gratis)

canales:

  ingenieria:
    activo: true
    nombre: "Hidden Engineering"
    idioma: en
    lema: "HOW THE WORLD REALLY WORKS"
    # Voz: Kokoro (IA de código abierto, gratis y sin límites). Otras: am_fenrir, am_puck, bm_george
    voz_kokoro: am_michael
    velocidad_voz: 1.0
    # Voz de respaldo (Microsoft Edge) si Kokoro no estuviera disponible
    voz: en-US-AndrewNeural
    # Paleta propia del canal (distinta de otros canales para que YouTube no vea "la misma plantilla")
    tema:
      bg: "#081426"
      bg2: "#11325E"
      grid: "#0C1D36"
      panel: "#14294A"
      text: "#F4F8FF"
      muted: "#8EA6C9"
      accent: "#38BDF8"
      accent2: "#FFD24A"
      red: "#FF4D4D"
      green: "#34D399"
      land: "#1C3A66"
      ocean: "#0A1A31"
    nicho: >
      Engineering and "how the world works": the hidden infrastructure and clever
      engineering behind everyday things (internet cables, power grids, bridges,
      skyscrapers, airports, tunnels, ships, water systems, logistics).
    publico: "Curious adults 18-54 in the US, UK, Canada and Australia"
    duracion_min: 10
    publicar:
      video: "18:00"
      short: "23:00"

  geografia:
    activo: false          # se activa cuando empecemos con este canal
    nombre: "Mapas Imposibles"
    idioma: es
    lema: "EL MUNDO COMO NUNCA TE LO HABÍAN EXPLICADO"
    voz_kokoro: em_alex
    velocidad_voz: 1.0
    voz: es-MX-JorgeNeural
    tema:
      bg: "#0E1A14"
      bg2: "#1F4A36"
      grid: "#13241B"
      panel: "#1A3327"
      text: "#FAF7F0"
      muted: "#9FB8A8"
      accent: "#FFA630"
      accent2: "#FFE08A"
      red: "#FF5A4E"
      green: "#5EE3A1"
      land: "#2B5A43"
      ocean: "#0B1611"
    nicho: >
      Geografía explicada: fronteras extrañas, por qué las ciudades están donde
      están, países y lugares con historias sorprendentes, mapas que cambian cómo
      ves el mundo. Español neutro.
    publico: "Adultos 18-45 de México, España, Colombia, Argentina, EE. UU. hispano y Latinoamérica"
    duracion_min: 10
    publicar:
      video: "22:00"
      short: "19:00"
