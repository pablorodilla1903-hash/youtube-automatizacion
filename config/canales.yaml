# ─────────────────────────────────────────────────────────────────────────────
# Configuración de los canales. Puedes editar este archivo desde la web de
# GitHub (icono del lápiz) sin tocar nada más.
# ─────────────────────────────────────────────────────────────────────────────

zona_horaria: Europe/Madrid   # tu hora local (para las horas de publicación)
drive_dias_guardar: 7         # se borran de Drive las carpetas con más días (15 GB gratis)

canales:

  atlas:
    activo: true
    nombre: "World Through Time"
    idioma: en
    lema: "HISTORY AND GEOGRAPHY, ONE MAP AT A TIME"
    # Colores de la marca (logo y banner): mapa antiguo, azul noche y oro
    marca_tema:
      bg: "#0C1626"
      bg2: "#1D3150"
      grid: "#15233A"
      panel: "#22385A"
      text: "#F6EEDC"
      muted: "#8FA3BF"
      accent: "#E3B04B"
      accent2: "#EAD9B0"
      land: "#1A2B44"
    # Voz Kokoro (IA de código abierto, gratis). af_heart es la de mayor calidad; alternativas: af_bella, am_michael, bm_george
    voz_kokoro: af_heart
    velocidad_voz: 0.94
    voz: en-US-AvaNeural            # respaldo (Microsoft Edge)
    subtitulos_incrustados: true
    tema:
      bg: "#0A1A22"
      bg2: "#173747"
      grid: "#0E222C"
      panel: "#16323F"
      text: "#F7F2E7"
      muted: "#9DB3B8"
      accent: "#F2B84B"
      accent2: "#FFD978"
      red: "#FF5A4E"
      green: "#4FC38A"
      blue: "#4DA8FF"
      land: "#2A4639"
      ocean: "#0B1C26"
    nicho: >
      Geography and history: why people live where they live, borders and maps
      with surprising stories, how rivers, mountains and deserts shaped empires
      and modern countries.
    publico: "Curious adults 18-54 in the US, UK, Canada, Australia and worldwide (auto-dubbed)"
    duracion_min: 10
    publicar:
      video: "18:00"
      short: "23:00"

  geografia:
    activo: false          # se activa cuando empecemos con este canal
    nombre: "Mapas Imposibles"
    idioma: es
    lema: "EL MUNDO COMO NUNCA TE LO HABÍAN EXPLICADO"
    voz_kokoro: em_alex
    velocidad_voz: 1.0
    voz: es-MX-JorgeNeural
    tema:
      bg: "#0E1A14"
      bg2: "#1F4A36"
      grid: "#13241B"
      panel: "#1A3327"
      text: "#FAF7F0"
      muted: "#9FB8A8"
      accent: "#FFA630"
      accent2: "#FFE08A"
      red: "#FF5A4E"
      green: "#5EE3A1"
      land: "#2B5A43"
      ocean: "#0B1611"
    nicho: >
      Geografía explicada: fronteras extrañas, por qué las ciudades están donde
      están, países y lugares con historias sorprendentes, mapas que cambian cómo
      ves el mundo. Español neutro.
    publico: "Adultos 18-45 de México, España, Colombia, Argentina, EE. UU. hispano y Latinoamérica"
    duracion_min: 10
    publicar:
      video: "22:00"
      short: "19:00"
